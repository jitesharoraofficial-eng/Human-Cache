services:
  # FastAPI Backend (100% Free Tier on Render)
  - type: web
    name: human-cache-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: SECRET_KEY
        generateValue: true
